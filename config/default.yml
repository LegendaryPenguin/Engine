# =====================================================================
# MarketEngine — run configuration
#
# Everything the pipeline does is decided here. There are no tickers,
# dates, or windows hard-coded anywhere in the package: change this file
# (or pass --config your_own.yml) and re-run. The file's SHA-256 goes
# into reports/run_manifest.json, so any output can be traced back to the
# exact config that produced it.
# =====================================================================

# Names the run. Outputs land under data/<...>/<run_id>/ and
# reports/<run_id>/, so two configs can coexist without overwriting
# each other.
run_id: baseline

# yfinance | alpaca — see marketengine/providers/. Both implement the
# same interface, so this is the only line that has to change.
provider: yfinance

universe:
  # The configurable set of instruments. A deliberate mix of single
  # stocks and ETFs across sectors, so the correlation matrix has
  # something to say.
  tickers:
    - AAPL
    - MSFT
    - NVDA
    - JPM
    - XOM
    - JNJ
    - QQQ
    - IWM
    - TLT
    - GLD
  # Every relative metric in analytics.py is measured against this, and
  # it also defines the trading calendar (see calendar.align below).
  benchmark: SPY

window:
  start: "2015-01-01"
  # null means "up to the most recent available close". Pin it to a date
  # for a frozen, byte-reproducible run.
  end: null

calendar:
  # benchmark  — keep only dates the benchmark traded (recommended: the
  #              benchmark defines "a trading day", and a date the
  #              benchmark did not trade cannot produce a relative metric)
  # intersect  — keep only dates EVERY ticker traded (strictest; throws
  #              away history for a late-listed name)
  # union      — keep every date any ticker traded (loosest; leaves holes)
  align: benchmark
  # 0 = never forward-fill prices. A carried price is a fabricated 0%
  # return on the fill day and a fabricated real return on the next one,
  # and at a one-day-to-one-month holding period that artefact is big
  # enough to look like a signal. Sessions with no bar are flagged
  # MISSING_SESSION and dropped, so a return spanning the hole is honestly
  # a two-day return. Raise it (2-3) only if you need a gap-free matrix
  # and are willing to pay for it; filled rows carry a FORWARD_FILLED flag
  # either way.
  max_ffill_days: 0

analytics:
  # Annualised rolling volatility is reported at each of these windows.
  rolling_vol_windows: [21, 63, 252]
  # Window for the rolling correlation-to-benchmark series.
  corr_window: 63
  # Annual risk-free rate used for Sharpe and for CAPM alpha. 0.02 is a
  # stand-in; swap in a real T-bill series if you want it exact.
  risk_free_annual: 0.02
  trading_days_per_year: 252
  # A ticker with less history than this is still stored and still
  # charted, but it is excluded from the full-period correlation matrix,
  # where a short overlap produces a confidently wrong number.
  min_history_days: 250
  # |daily return| above this is flagged EXTREME_RETURN. Flagged, not
  # dropped: a 60% move is usually real (earnings, a biotech readout) and
  # silently deleting it is the actual error.
  extreme_return_threshold: 0.50
  # ...and so is a move this many trailing standard deviations out, which
  # is the only test that catches a bad print on a name that routinely
  # moves 15%. The absolute threshold above is the only test that catches
  # a decimal-point error on a quiet bond ETF. Both are needed.
  extreme_return_vol_units: 8.0
  # Window for that trailing sigma. Measured strictly BEFORE the bar being
  # tested, so an outlier cannot inflate its own yardstick.
  quality_vol_window: 20
  # This many consecutive identical observed closes is flagged STALE_PRICE.
  # A frozen vendor feed and a market with no trades look identical.
  stale_price_sessions: 3

storage:
  # Root for everything the pipeline writes. Gitignored.
  root: data
  # DuckDB file holding views over the curated Parquet, so the panel is
  # queryable with SQL without loading it into pandas first.
  duckdb_file: marketengine.duckdb

outputs:
  figures: true
  # PNG dots-per-inch for saved figures.
  dpi: 150
