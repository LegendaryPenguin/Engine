# =====================================================================
# MarketEngine — the same pipeline against Alpaca instead of Yahoo.
#
# The only substantive difference from default.yml is `provider`. That is
# the point of the config: swapping the data vendor is one line, not a code
# change, because both providers return the same schema.
#
#   python -m marketengine --config config/alpaca.yml run
#
# Needs credentials in .env (see .env.example). Paper keys work — this only
# reads market data.
#
# Two things to know before comparing the outputs to the yfinance run:
#
#   - The free tier serves the IEX feed. Its closes track the consolidated
#     tape closely, but daily VOLUME is IEX-only (roughly 2-3% of the real
#     number) and open/high/low are IEX prints. Do not build a
#     volume-based signal on this feed.
#   - IEX history is shallow. Measured, not guessed: on a free key the
#     first usable SPY bar is 2020-07-27, so this window starts there
#     rather than at Yahoo's 2015. Expect ~1,545 sessions, not ~2,945.
#
# One artefact worth knowing about, because it is the kind of thing that
# quietly corrupts a benchmark. Asking Alpaca for 2016 onwards returns a
# single SPY bar dated 2018-11-01 with a volume of 200 shares — one small
# IEX print — and then nothing until 2020-07-27. That lone bar is real in
# the sense that a trade happened, and useless in every other sense: it
# drags the benchmark's first_date back twenty months and opens a hole the
# coverage check cannot see, because the benchmark is what defines the
# calendar. Starting the window after it is the fix here. The general fix
# is a liquidity floor at admission, which is ROADMAP phase 3.
# =====================================================================

run_id: alpaca
provider: alpaca

universe:
  tickers:
    - AAPL
    - MSFT
    - NVDA
    - JPM
    - XOM
    - JNJ
    - QQQ
    - IWM
    - TLT
    - GLD
  benchmark: SPY

window:
  start: "2020-08-01"
  end: null

calendar:
  align: benchmark
  max_ffill_days: 0

analytics:
  rolling_vol_windows: [21, 63, 252]
  corr_window: 63
  risk_free_annual: 0.02
  trading_days_per_year: 252
  min_history_days: 250
  extreme_return_threshold: 0.50
  extreme_return_vol_units: 8.0
  quality_vol_window: 20
  stale_price_sessions: 3

storage:
  root: data
  duckdb_file: marketengine.duckdb

outputs:
  figures: true
  dpi: 150
